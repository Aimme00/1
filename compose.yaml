services:
  askdata:
    build: .
    ports:
      - "8000:8000"
    environment:
      ASKDATA_HOST: 0.0.0.0
      ASKDATA_PORT: 8000
      ASKDATA_RUNTIME_DIR: /app/runtime_data
      ASKDATA_ENV: ${ASKDATA_ENV:-development}
      ASKDATA_BOOTSTRAP_EMAIL: ${ASKDATA_BOOTSTRAP_EMAIL:-}
      ASKDATA_BOOTSTRAP_PASSWORD: ${ASKDATA_BOOTSTRAP_PASSWORD:-}
      ASKDATA_BOOTSTRAP_DISPLAY_NAME: ${ASKDATA_BOOTSTRAP_DISPLAY_NAME:-}
      ASKDATA_SESSION_TTL_SECONDS: ${ASKDATA_SESSION_TTL_SECONDS:-86400}
      ASKDATA_COOKIE_SECURE: ${ASKDATA_COOKIE_SECURE:-}
      ASKDATA_DATABASE_TYPE: ${ASKDATA_DATABASE_TYPE:-sqlite}
      ASKDATA_DATABASE_ALIAS: ${ASKDATA_DATABASE_ALIAS:-trade_db}
      ASKDATA_ENFORCE_READONLY: ${ASKDATA_ENFORCE_READONLY:-true}
      ASKDATA_REQUIRE_SQLGLOT: ${ASKDATA_REQUIRE_SQLGLOT:-true}
      ASKDATA_SCHEMA_SAMPLE_SIZE: ${ASKDATA_SCHEMA_SAMPLE_SIZE:-0}
      ASKDATA_BUSINESS_META_PATH: ${ASKDATA_BUSINESS_META_PATH:-}
      ASKDATA_MYSQL_HOST: ${ASKDATA_MYSQL_HOST:-}
      ASKDATA_MYSQL_PORT: ${ASKDATA_MYSQL_PORT:-3306}
      ASKDATA_MYSQL_USER: ${ASKDATA_MYSQL_USER:-}
      ASKDATA_MYSQL_PASSWORD: ${ASKDATA_MYSQL_PASSWORD:-}
      ASKDATA_MYSQL_DATABASE: ${ASKDATA_MYSQL_DATABASE:-}
      ASKDATA_MYSQL_CONNECT_TIMEOUT: ${ASKDATA_MYSQL_CONNECT_TIMEOUT:-10}
      ASKDATA_MYSQL_READ_TIMEOUT: ${ASKDATA_MYSQL_READ_TIMEOUT:-30}
      ASKDATA_MYSQL_MAX_EXECUTION_TIME_MS: ${ASKDATA_MYSQL_MAX_EXECUTION_TIME_MS:-30000}
      ASKDATA_MYSQL_MAX_ROWS: ${ASKDATA_MYSQL_MAX_ROWS:-5000}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_WORKSPACE_ID: ${DASHSCOPE_WORKSPACE_ID:-}
    volumes:
      - askdata_runtime:/app/runtime_data
    restart: unless-stopped

volumes:
  askdata_runtime:
